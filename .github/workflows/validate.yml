name: Validate SHIFT

on:
  pull_request:
    branches: [main, master, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate SHIFT intelligence core
        run: npm run validate:shift-core
      - name: Preview-compatible build
        run: npx vite build --config vite.preview.config.ts
