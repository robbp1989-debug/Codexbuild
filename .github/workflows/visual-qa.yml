name: Visual QA

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start SHIFT preview
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/shift-preview.log 2>&1 &
          echo $! > /tmp/shift-preview.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shift-preview.log
          exit 1

      - name: Capture golden and rebuilt screenshots
        run: npx -y @playwright/test@1.55.0 test qa/visual.spec.ts --browser=chromium --reporter=line

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-golden-visual-qa
          path: qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shift-preview-log
          path: /tmp/shift-preview.log
          retention-days: 7
