name: Visual QA

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright and verify Chrome
        run: |
          npm install --no-save @playwright/test@1.55.0
          google-chrome --version

      - name: Prepare pinned golden preview fixture
        run: |
          mkdir -p public/qa
          curl -fsSL https://raw.githubusercontent.com/robbp1989-debug/Codexbuild/eb4b835a319ac4e005a738c2e39a1527772142ec/preview/shift-live-scroll.html > public/qa/shift-live-scroll.html
          sed -i 's#https://raw.githubusercontent.com/robbp1989-debug/Codexbuild/master/public/landing-sequence/frame-0001.webp#/landing-sequence/frame-0001.webp#g' public/qa/shift-live-scroll.html
          sed -i 's#https://raw.githubusercontent.com/robbp1989-debug/Codexbuild/master/public/landing-sequence/shift-office-entry.mp4#/landing-sequence/shift-office-entry.mp4#g' public/qa/shift-live-scroll.html

      - name: Start SHIFT preview
        run: |
          nohup npm run dev -- --host localhost --port 3000 > /tmp/shift-preview.log 2>&1 &
          echo $! > /tmp/shift-preview.pid
          for i in {1..90}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shift-preview.log
          exit 1

      - name: Capture golden and rebuilt screenshots
        run: npx playwright test qa/visual.spec.ts qa/keep-talking-reference.spec.ts --reporter=line

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-golden-visual-qa
          path: qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shift-preview-log
          path: /tmp/shift-preview.log
          retention-days: 7
