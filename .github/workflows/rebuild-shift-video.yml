name: Rebuild SHIFT video asset

on:
  push:
    branches:
      - codex/video-asset-final
    paths:
      - '.asset-chunks/READY'

permissions:
  contents: write

jobs:
  rebuild-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/video-asset-final
      - name: Rebuild optimized MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/landing-sequence
          cat .asset-chunks/chunk-* | base64 --decode > public/landing-sequence/shift-office-entry.mp4
          test -s public/landing-sequence/shift-office-entry.mp4
          rm -rf .asset-chunks
          rm -f .github/workflows/rebuild-shift-video.yml
      - name: Commit video asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optimized SHIFT office-entry video" || exit 0
          git push origin HEAD:codex/video-asset-final
